generated: '2026-09-04'
method: searched
source: https://sdk.virtualitics.com/latest/migration-guide/
checked: '2026-09-04'
summary: >-
  Virtualitics publishes no dated changelog. The one public record of what changed is the
  Virtualitics SDK Migration Guide, which is version-keyed rather than date-keyed: it walks each
  minor upgrade from 1.46.x to 1.54.x with New Features, Breaking Changes and Action Required, and
  states the current version as 1.61.x. The Help Center has a "Release Notes by Date" section
  (https://docs.virtualitics.com/hc/en-us/sections/21955755696147-Release-Notes-by-Date) but it
  contains ZERO published articles. Nothing is published for the CLI or for pyVIP beyond PyPI
  release dates.
scheme: semantic-ish (major.minor.patch), documented per minor band
dated: false
current_version: 1.61.x
current_version_source: >-
  "Current Version: 1.61.x" heading on the migration guide, 2026-09-04. Note the latest
  virtualitics-sdk wheel on PyPI is 1.62.0 (published 2026-04-20), so the guide trails the
  registry by one minor.
coverage_gap: >-
  The guide documents 1.46.x through 1.54.x. Upgrades from 1.54 to the current 1.61/1.62 are NOT
  documented anywhere public — seven minor versions with no published notes.
