surface_shape: >-
  IMPORTANT CONTEXT FOR EVERY FIELD BELOW. Virtualitics does not publish an HTTP API. Its developer
  contract is a Python programming model — the Virtualitics SDK for authoring Apps, the `vaip` CLI
  for deploying them into a customer tenant, and pyVIP's WebSocket link to a local Virtualitics
  Explore instance. Conventions that only exist for HTTP APIs (pagination cursors, request-id
  headers, error envelopes, rate-limit headers) therefore have no published counterpart, and are
  recorded as `na` rather than as failures. Conventions that DO apply to a programming model —
  identity, state, persistence, error display, versioning, reversibility — are recorded from the
  provider's own documentation.
