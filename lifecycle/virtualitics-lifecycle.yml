checked: '2026-09-04'
summary: >-
  Virtualitics versions its SDK per minor band and publishes a migration guide with explicit
  breaking-change and action-required sections — a real, if version-keyed, lifecycle discipline.
  It publishes NO status page, NO deprecation policy, NO SLA and NO support-window statement, and
  it serves no Sunset or Deprecation headers because there is no HTTP API to serve them on.
versioning:
  scheme: major.minor.patch on the SDK, CLI and pyVIP packages; the platform is versioned as VAIP <major>.<minor> (e.g. VAIP 1.23+, VAIP 1.22.1)
  documented: true
  docs: https://sdk.virtualitics.com/latest/migration-guide/
  api_versioning: not applicable — no HTTP API surface is published
  docs_versioning: >-
    The SDK documentation site is version-addressed (sdk.virtualitics.com/<version>/ with a
    /latest/ alias); its sitemap enumerates 1.72.0 paths while /latest/ currently serves 1.61.x
    content.
  platform_version_gating: >-
    Help Center tutorials are explicitly gated on platform version — "App Building Guide 1: Hello,
    World! (VAIP 1.23+)" — and superseded material is labelled rather than deleted, e.g.
    "Immerse in Virtual Reality (VR) - VAIP 1.22.1 and Earlier".
deprecation:
  policy_published: false
  policy_url: null
  sunset_header: false
  deprecation_header: false
  notice_period: null
  observed_practice: >-
    Breaking removals ship inside a minor version with a documented migration path and no
    announced deprecation window. The 1.51.0 removal of the entire CustomEvent family is the
    clearest example: "CustomEvent has been fully removed. All CustomEvent subclasses are gone."
    The guide supplies before/after code but no prior-deprecation release, no shim and no dated
    end-of-support.
  source: https://sdk.virtualitics.com/latest/migration-guide/
support_window:
  published: false
  note: >-
    No statement of which SDK minors remain supported. The migration guide covers 1.46.x-1.54.x
    while the current release is 1.62.0, leaving seven undocumented minors.
