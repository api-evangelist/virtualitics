summary: >-
  Virtualitics documents no rate limits. There is no published HTTP API to rate-limit: the
  developer surface is the Python SDK, the `vaip` CLI and pyVIP's WebSocket connection to the
  user's own Virtualitics Explore instance, all running against a customer-controlled tenant. No
  X-RateLimit-*, RateLimit-* or Retry-After header is documented, no 429 semantics are described,
  and no per-key, per-account or per-endpoint allowance appears in any public article.
