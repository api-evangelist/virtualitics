aid: virtualitics
name: Virtualitics
description: Virtualitics, Inc. is a Pasadena, California AI software company founded in 2016 on more
  than a decade of research at Caltech and NASA's Jet Propulsion Laboratory. It builds the Virtualitics
  AI Platform (VAIP), a secure deployment target for mission-critical AI Apps; Virtualitics Explore, a
  3D/immersive data exploration client; Virtualitics Predict; the Integrated Readiness Optimization (IRO)
  application suite; and Iris, a natural-language AI agent over platform data. Its developer surface is
  Python-first rather than HTTP-first — the Virtualitics SDK (virtualitics-sdk) for authoring multi-step
  Apps, the Virtualitics CLI (virtualitics-cli, the `vaip` command) for packaging and deploying them into
  a customer tenant, and pyVIP, a Python API that drives Virtualitics Explore over a WebSocket connection.
  Deployments run on customer-controlled hosts including NIPR, SIPR, JWICS, ADVANA and ODIN across the
  U.S. military services.
