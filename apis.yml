apis:
- aid: virtualitics:virtualitics-ai-platform
  name: Virtualitics AI Platform (VAIP) Developer Experience
  image: https://virtualitics.com/wp-content/uploads/2026/06/Virtualitics_Logo_Black.png
  description: 'The developer surface of the Virtualitics AI Platform. Developers author AI Apps in Python
    with the Virtualitics SDK (App, Step, Page, Section, Card, Elements, Assets, LLM/Iris, Store, Audit,
    Triggers), build a wheel and deploy it into their own VAIP tenant with the `vaip` CLI. There is no
    publicly documented HTTP contract: the platform is delivered per-customer at a tenant host and the
    SDK/CLI are the published integration path.'
