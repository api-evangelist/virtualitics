- aid: virtualitics:virtualitics-explore-python-api
  name: Virtualitics Explore Python API (pyVIP)
  image: https://virtualitics.com/wp-content/uploads/2026/06/Virtualitics_Logo_Black.png
  description: pyVIP is the Virtualitics Python API for Virtualitics Explore. It runs over a WebSocket
    connection between Virtualitics Explore (server) and a Python session (client), launched from the
    API section of the Explore Settings window on a user-chosen port, and authenticated with an API Token
    generated in the Virtualitics Account Portal (VIP_AUTH_TOKEN), optionally with a client-supplied encryption
    key (VIP_ENCRYPTION_KEY). Because the server is the user's own Explore instance there is no vendor-hosted
    base URL.
  humanURL: https://docs.virtualitics.com/hc/en-us/articles/25110834780435-Using-the-Virtualitics-Python-API-pyVIP
  tags:
  - Data Visualization
  - Python
  - WebSocket
